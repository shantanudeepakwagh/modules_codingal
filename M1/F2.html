<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Fork Information</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>

  <body>
    <form>
      <fieldset>
        <!-- The fieldset tag is used to group related elements in a form -->
        <legend>Fork Information:</legend>

        <label>Fork Name:</label>
        <!-- placeholder provides extra information about the entry -->
        <input type="text" id="forkname" placeholder="Enter Fork Name">
        <br><br>

        <label>Fork Material:</label>
        <input type="text" id="material" placeholder="Enter Material">
        <br><br>

        <label>Fork Type:</label><br>
        <input type="radio" id="dinner" name="forktype" value="Dinner Fork">
        Dinner Fork<br>

        <input type="radio" id="salad" name="forktype" value="Salad Fork">
        Salad Fork<br><br>

        <label>Date Purchased:</label>
        <input type="date" id="date" name="date">
        <br><br>

      </fieldset>
    </form>
  </body>
</html>
