<!DOCTYPE html>
<html>
<body>

<h1>Details of Forks</h1>

<form>
  <fieldset>

    <legend>Fork Information:</legend>

    <label>Fork Name:</label>
    <input type="text" id="fname" name="fname"><br><br>

    <label>Fork Brand:</label>
    <input type="text" id="lname" name="lname"><br><br>

    <label>Fork Type:</label><br><br>

    <input type="radio" name="forktype" value="Dinner Fork">
    Dinner Fork<br><br>

    <input type="radio" name="forktype" value="Salad Fork">
    Salad Fork<br><br>

    <input type="radio" name="forktype" value="Dessert Fork">
    Dessert Fork<br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email"><br><br>

    <label for="password">Password:</label>
    <input type="password" name="password"><br><br>

    <label for="birthday">Purchase Date:</label>
    <input type="date" id="birthday" name="birthday"><br><br>

    <label for="description">Fork Description:</label><br>
    <textarea rows="5" cols="50" name="description">Enter fork description here...</textarea>
    <br><br>

    <label for="fileupload">Fork Image:</label><br><br>
    <input type="file" name="fileupload" accept="image/*">
    <br><br><br><br>

    <center>
      <input type="submit" name="submit" value="Submit">
      <input type="reset" name="reset" value="Reset">
    </center>

  </fieldset>
</form>

</body>
</html>
