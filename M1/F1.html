<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Fork Details Form</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>

  <body>
    <h1>Fork Details Form</h1>

    <form>
      <label>Name</label><br>
      <input type="text" id="name"><br><br>

      <label>Email ID</label><br>
      <input type="text" id="email"><br><br>

      <label>Fork Type</label><br>
      <input type="radio" id="dinner" name="fork" value="Dinner Fork">
      Dinner Fork<br>

      <input type="radio" id="salad" name="fork" value="Salad Fork">
      Salad Fork<br><br>

      <label>Favourite Fork Material</label><br>
      <input type="checkbox" id="steel" value="Stainless Steel">
      Stainless Steel<br>

      <input type="checkbox" id="plastic" value="Plastic">
      Plastic<br><br>

      <label>Favourite Fork Color</label><br>
      <input type="text" id="color"><br><br>

      <input type="submit">
    </form>
  </body>
</html>
