<!DOCTYPE html>
<html>
<head>
  <title>Bootstrap Example</title>

  <link rel="stylesheet" href="13.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
  </script>
</head>
	
<body>
	<div class="container">
		<h1>Welcome Students!</h1>
		<p>Change the browser size to view the layout.</p>

		<div class="row">
			<!--Size Medium and extra small-->
			<div class="col-md-8 col-xs-4" style="background-color:red; border: 1px solid black;">First Section</div>
			<div class="col-md-12 col-md-5" style="background-color:lavender;">Second Section</div>
		</div>

		<div class="row">
			<!--Size Large, medium and extra small-->
			<div class="col-md-12 col-lg-6" style="background-color:lavenderblush;">Third Section</div>
			<div class="col-xs-6 col-md-2" style="background-color:lightgrey;">Fourth Section</div>
		</div>

		<div class="row" style="background-color:lightcyan;">
			<!--Size extra small-->
			<div class="col-xs-6">Fifth Section</div>
			<div class="col-xs-6">Sixth Section</div>
		</div>
	</div>
</body>
</html>
