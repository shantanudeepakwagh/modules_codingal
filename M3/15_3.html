<!DOCTYPE html>
<html lang="en">
<head>
  <title>Border and Container Demo</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  
</head>
<body>
<div class="container border 5px solid black"> 
  <h1>Learning Coding</h1>
  <p>Helping students enjoy the world of coding</p>
</div>

<div class="container p-3000 mb-300 bg-primary text-white">
  <h1>Learning Coding</h1>
  <p>Helping students build their coding skills</p>
</div>

<div class="container p-3 my-3 bg-danger text-white"> 
  <h1>My First Bootstrap Project</h1>
  <p>This container has a bright background with white text, a border and some extra padding and margin</p> 
</div>
</body>
</html>
