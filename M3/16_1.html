<!DOCTYPE html>
<html lang="en">
<head>
	<title>Bootstrap Jumbotron</title>
	
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="stylesheet" href=
"https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
	
	<script src=
"https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
	</script>
</head>

<body style="text-align:center;">
	<div class="jumbotron jumbotron-fluid">
		<div class="container">
			<h1 style="color:orange;">
				Welcome to Codingal
			</h1>
			
			
<p>Empowering the next generation to build the future through code.</p>
		</div>
	</div>
	
	<div class="container mt-3">
         
        <h2>Explore Options</h2>
         
        <button type="button" class="btn btn-primary">Start Now</button>
        <button type="button" class="btn btn-secondary">Learn More</button>
        <button type="button" class="btn btn-success">Join Class</button>
        <button type="button" class="btn btn-warning">View Courses</button>
        <button type="button" class="btn btn-danger">Contact Us</button>
    </div>

</body>

</html>
