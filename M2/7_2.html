<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Colour Card</title>

    <style>

      /* Universal Selector - applies to everything on the page */
      * {
        font-size: 16px;
      }

      /* Element Selectors */
      body {
        background-color: lightyellow;
      }

      h1 {
        color: darkgreen;
      }

      h2 {
        color: darkorange;
      }

      p {
        color: darkslategray;
      }

      /* Class Selector */
      .my-detail {
        color: darkblue;
        font-weight: bold;
      }

      /* ID Selector */
      #my-card {
        background-color: lavender;
      }

    </style>

  </head>
  <body>

    <h1>My Favourite Card</h1>

    <!-- Inline CSS -->
    <p style="color: crimson;">Hello! Welcome to my webpage.</p>

    <div id="my-card">

      <h2>About Me</h2>
      <p class="my-detail">My name is Alex.</p>
      <p class="my-detail">My favourite colour is blue.</p>
      <p class="my-detail">My favourite subject is Science.</p>
      <p class="my-detail">My favourite food is pizza.</p>

    </div>

    <h2>My Favourite Things</h2>
    <p>My favourite animal is a dog.</p>
    <p>My favourite sport is football.</p>
    <p>My favourite movie is Toy Story.</p>

  </body>
</html>
