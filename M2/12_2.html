<!DOCTYPE html>
<html>
<head>
<style>
div {
  background-color: #2196F3;
  padding: 12px;
}

div.first {
  opacity: 0.2;
}

div.second {
  opacity: 0.4;
}

div.third {
  opacity: 0.7;
}
</style>
</head>
<body>

<h1>The Opacity Property</h1>

<p>This example shows different opacity levels:</p>

<div class="first"><p>opacity 0.2</p></div>
<div class="second"><p>opacity 0.4</p></div>
<div class="third"><p>opacity 0.7</p></div>
<div><p>opacity 1 (default)</p></div>

</body>
</html>
