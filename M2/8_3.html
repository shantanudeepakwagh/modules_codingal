<!DOCTYPE html>
<html>
<head>
<style> 
/* The animation code */
@keyframes example {
  0%   {background-color: magenta;}
  25%  {background-color: orange;}
  50%  {background-color: teal;}
  100% {background-color: olive;}
}

/* The element to apply the animation to */
div {
  width: 100px;
  height: 100px;
  background-color: red;
  animation-name: example;
  animation-duration: 4s;
}

</style>
</head>
<body>
​<div>
Hello</div></body>
</html>
