<!DOCTYPE html>
<html>

<head>
  <style>
    *{
      text-align: center;
      font-family: Arial, sans-serif;
    }

    #text{
      text-shadow: 3px 3px 2px #3366CC;
      /* (right-offset)px (left-offset)px (fade)px color*/
    }

    #box{
      box-shadow: 7px 7px 4px #555555;
      /* (right-offset)px (left-offset)px (fade)px color*/
    }

    #indent{
      text-indent: 40%; /* 16px or -3em */
    }
  </style>
</head>

<body>

    <h1 id="text">Text shadow adds an effect to the text</h1>

    <h1 id="box">Box shadow adds an effect to an element</h1>

    <div>
        <p>This paragraph demonstrates text indentation.</p>
        <p id="indent">This paragraph demonstrates text indentation.</p>
    </div>

</body>

</html>
