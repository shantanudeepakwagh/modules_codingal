<!DOCTYPE html>
<html>
<head>
<style>
div.relative {
  position: relative;
  left: 40px;
  border: 3px solid #FF5733;
}

div.fixed {
  position: fixed;
  left: 40px;
  border: 3px solid #FF5733;
}

div.absolute {
  position: absolute;
  left: 40px;
  border: 3px solid #FF5733;
}

div.static {
  position: static;
  left: 40px;
  border: 3px solid #FF5733;
}
</style>
</head>

<body>

<h2>CSS Positions</h2>

<p>An element with position: relative; is moved relative to its normal position:</p>

<div class="relative">
This div uses relative positioning.
</div>

<br><br>

<div class="fixed">
This div uses fixed positioning.
</div>

<br><br>

<div class="absolute">
This div uses absolute positioning.
</div>

<br><br>

<div class="static">
This div uses static positioning.
</div>

</body>
</html>
