<!DOCTYPE html>
<html>
<head>
<style>
h1 {
  text-decoration: underline;
  text-transform: uppercase;
}

h2 {
  text-decoration: overline;
  text-transform: lowercase;
}

h3 {
  text-decoration: line-through;
  text-transform: capitalize;
}

h4 {
  text-decoration: underline overline;
  text-transform: none;
}
</style>
</head>
<body>

<h1>Text Styling</h1>

<div class="text1">Learn web development</div>
<div class="text2">Learn web development</div>
<div class="text3">Learn web development</div>

<p class="p1">Learn web development</p>
<p class="p2">Learn web development</p>
<p class="p3">Learn web development</p>

</body>
</html>
