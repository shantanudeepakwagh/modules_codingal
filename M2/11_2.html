<!DOCTYPE html>
<html>
    <head>
        <style>
            img#forkRight{
                float:right
            }

            img#forkLeft{
                float:left
            }
          
        </style>
    </head>

    <body>
        
        <h2>Float Right</h2>
        
        <p>In this example, the image will float to the right in the paragraph, and the text in the paragraph will wrap around the image.</p>
        
        <p>
            <img id="forkRight" src="a.jpg" alt="fork" style="width:100px;height:100px;">
            <img id="forkLeft" src="a.jpg" alt="fork" style="width:100px;height:100px;">
            This is a dummy content used to understand the float property.
        </p>

    </body>
</html>
